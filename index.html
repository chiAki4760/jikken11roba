<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おかしの家とまほうの遊園地 // 夢の簿記ドリル</title>
  <style>
    * { box-sizing: border-box; }

    /* ==================================================
       ★ テーマカラー：カラフル＆ポップで美味しそうなお菓子の国
    ================================================== */
    :root {
      --primary: #ff5e97;       /* いちごストロベリーソース */
      --primary-hover: #ff337a; /* 完熟ベリーピンク */
      --bg-body: #fff7ed;       /* 焼き立てバニラクッキーの香り */
      --card-bg: #ffffff;       /* ホイップクリームホワイト */
      --text-main: #4a2810;     /* 濃厚ミルクチョコレート色 */
      --text-muted: #9c6644;    /* 香ばしいビスケットブラウン */
      --border: #ffd1dc;        /* パステルピンクのアイシングライン */
      --debit-border: #38bdf8;  /* 借方：ラムネソーダブルー */
      --credit-border: #fb923c; /* 貸方：オレンジドロップ */
      --correct-bg: #fef08a;    /* 正解：あま〜いカスタードイエロー */
      --correct-text: #854d0e;  /* 正解文字：ハニーキャラメル */
      --wrong-bg: #fee2e2;      /* 不正解：ストロベリーシェイクの警告 */
      --wrong-text: #991b1b;    /* 不正解文字：ルビーシロップ */
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "M PLUS Rounded 1c", -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-body);
      /* ギンガムチェック風の可愛いテーブルクロス柄 */
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(255, 182, 193, 0.25) 20px, rgba(255, 182, 193, 0.25) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255, 228, 196, 0.35) 20px, rgba(255, 228, 196, 0.35) 40px);
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 4px solid #ffccd5;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(255, 154, 162, 0.25), 0 0 0 6px #fff;
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 3px dotted #ffb3c1;
      margin-bottom: 16px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 2.2rem; line-height: 1; }
    .logo-title { 
      margin: 0; 
      font-size: 1.2rem; 
      color: #ff4d6d; 
      font-weight: 800;
      letter-spacing: 0.05em;
    }
    .status-badge {
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(255, 117, 140, 0.3);
    }
    .status-badge.review { 
      background: linear-gradient(135deg, #f59e0b, #d97706); 
      box-shadow: 0 3px 8px rgba(245, 158, 11, 0.3);
    }

    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    @media (max-width: 480px) {
      .stage-tabs { grid-template-columns: repeat(3, 1fr); }
    }
    .stage-btn {
      padding: 8px 4px;
      border: 2px solid #ffccd5;
      border-radius: 12px;
      background: #fff0f3;
      font-size: 0.72rem;
      font-weight: bold;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      line-height: 1.25;
      transition: all 0.2s ease;
    }
    .stage-btn:hover { background: #ffe5ec; }
    .stage-btn.active {
      background: #ff4d6d;
      color: white;
      border-color: #ff4d6d;
      box-shadow: 0 3px 10px rgba(255, 77, 109, 0.35);
      transform: translateY(-1px);
    }

    .quest-progress {
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #fff0f3;
      border: 2px dashed #ffccd5;
      border-radius: 14px;
    }
    .progress-track {
      height: 12px;
      width: 100%;
      background: #ffd8e4;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff9a9e, #fecfef, #a1c4fd);
      transition: width 0.3s ease;
    }

    .card {
      background: #fffaf0;
      border: 2px solid #fed7aa;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(251, 146, 60, 0.1);
    }
    .question-label {
      display: inline-block;
      background: #ff70a6;
      color: white;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .story-text { margin: 0; font-size: 0.98rem; line-height: 1.7; color: #4a2810; }

    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }
    .side-column {
      padding: 14px;
      background: #f0f9ff;
      border: 2px solid var(--debit-border);
      border-radius: 14px;
    }
    .side-column.credit { 
      background: #fff7ed;
      border-color: var(--credit-border); 
    }
    .side-title { 
      text-align: center; 
      margin-bottom: 10px; 
      font-weight: 800; 
      font-size: 0.88rem; 
      color: var(--text-main);
    }
    .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .entry-row input {
      padding: 8px 10px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.92rem;
      background: #ffffff;
      color: var(--text-main);
      width: 100%;
    }
    .entry-row input[type="text"] { flex: 1.3; }
    .entry-row input[type="number"] { flex: 1; }
    .entry-row input:focus { outline: none; border-color: var(--primary); }
    .btn-remove {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
      padding: 0 10px;
    }
    .btn-add {
      width: 100%;
      padding: 8px;
      background: #ffffff;
      border: 2px dashed #cbd5e1;
      color: var(--text-muted);
      border-radius: 10px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-add:hover { background: #fdf4ff; border-color: var(--primary); color: var(--primary); }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #ff5e97, #ff2a75);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 94, 151, 0.4);
      transition: all 0.2s ease;
      letter-spacing: 0.05em;
    }
    .btn-submit:hover { 
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 94, 151, 0.5);
    }

    .result-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.65;
    }
    .result-box.correct { 
      background: var(--correct-bg); 
      border: 2px solid #facc15; 
      color: var(--correct-text); 
    }
    .result-box.wrong { 
      background: var(--wrong-bg); 
      border: 2px solid #f87171; 
      color: var(--wrong-text); 
    }
    
    .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn {
      flex: 1;
      padding: 11px;
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: #e2e8f0; }

    .clear-card { display: none; text-align: center; padding: 24px 16px; }
    .btn-review, .btn-restart {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-review { background: #f59e0b; color: white; }
    .btn-restart { background: #94a3b8; color: white; }

    details {
      margin-top: 22px;
      border-top: 2px dashed #fed7aa;
      padding-top: 14px;
    }
    summary { cursor: pointer; font-size: 0.82rem; color: var(--text-muted); font-weight: bold; }
    textarea {
      width: 100%;
      height: 90px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-family: monospace;
      font-size: 0.82rem;
      background: #fff;
    }
    .load-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .shake-animation {
      animation: dmgShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes dmgShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    .rising-item {
      position: fixed;
      bottom: -30px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: riseMagic ease-out forwards;
    }
    @keyframes riseMagic {
      0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; }
      15% { opacity: 0.95; }
      50% { transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg); opacity: 0.9; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="container" id="mainContainer">
  <div class="header">
    <div class="logo-area">
      <div class="logo-icon" id="app-logo">🧁</div>
      <div>
        <h1 class="logo-title" id="app-title">おかしの国と日曜日ランド</h1>
        <div style="font-size:0.75rem; color:var(--text-muted);" id="sub-title">〜 毎日あそび放題のスイーツ王国 〜</div>
      </div>
    </div>
    <span class="status-badge" id="status-tag">たのしくあそび中♪</span>
  </div>

  <div class="stage-tabs">
    <button type="button" class="stage-btn active" id="tab-0" onclick="switchStage(0)">1日目: おもちゃの国</button>
    <button type="button" class="stage-btn" id="tab-1" onclick="switchStage(1)">2日目: ロバへの変異</button>
    <button type="button" class="stage-btn" id="tab-2" onclick="switchStage(2)">3日目: サーカスと売却</button>
    <button type="button" class="stage-btn" id="tab-3" onclick="switchStage(3)">4日目: 海とフカの胃袋</button>
    <button type="button" class="stage-btn" id="tab-4" onclick="switchStage(4)">5日目: 労働と本当の人間</button>
  </div>

  <div class="quest-progress">
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold;">
      <span id="stage-badge-text">1日目：甘い誘惑とおもちゃの国</span>
      <span id="progress-text">第 1 問</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="quiz-area">
    <div class="card">
      <div class="question-label" id="q-number">SUGAR // 01</div>
      <p class="story-text" id="story-display">読み込み中...</p>
    </div>

    <div class="split-container">
      <div class="side-column">
        <div class="side-title">借方 (Debit) 🍬</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ ケーキをのせる（行追加）</button>
      </div>
      <div class="side-column credit">
        <div class="side-title">貸方 (Credit) 🍩</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ クッキーをならべる（行追加）</button>
      </div>
    </div>

    <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">おかしを食べる！（仕訳判定）</button>
    <div id="result-display" class="result-box"></div>

    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ もどる</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">つぎのお菓子へ ▶</button>
    </div>
  </div>

  <div id="clear-area" class="clear-card">
    <h2 id="clear-heading" style="color:var(--primary);">ステージクリア！</h2>
    <div id="complete-badge-area"></div>
    <p id="score-text" style="line-height:1.6; color:var(--text-muted);"></p>
    <div id="review-btn-area"></div>
    <button type="button" class="btn-restart" onclick="startFreshStage()">この日曜日をもう一度あそぶ</button>
  </div>

  <details>
    <summary>📥 おかしのレシピを追加する (JSON)</summary>
    <textarea id="json-input" placeholder="AIで作成したJSON配列をここに貼り付けると、現在の日曜日を上書きできます"></textarea>
    <button type="button" class="load-btn" onclick="loadCustomData()">レシピを更新</button>
  </details>

  <span class="reset-link" onclick="forceReset()">※ おかしの国をぜんぶ初期化する</span>
</div>
<script>
// ==================================================
// ★ 演出絵文字設定エリア（見た目はかわいいスイーツたち）
// ==================================================
const RISING_EFFECT_SYMBOLS = ["🍬", "🍭", "🍰", "🍩", "🧁", "🍓", "🍫", "🍪", "🥞", "✨"];

// ==================================================
// 内蔵初期問題データ（ピノッキオの冒険：おもちゃの国〜人間の子供へ）
// ==================================================
const STAGES = [
  {
    title: "1日目：甘い誘惑とおもちゃの国",
    questions: [
      {
        "story": "「ここは一週間ずっと日曜日！勉強なんてしなくていいんだよ！」色鮮やかなドロップキャンディ 100,000円分を仕入れ、ポケットの小遣い（現金）で支払った。（仕入）（現金）",
        "debit": [{ "account": "仕入", "amount": 100000 }],
        "credit": [{ "account": "現金", "amount": 100000 }],
        "explanation": "費用（Expense）である「仕入」を借方に計上し、資産（Asset）である「現金」の減少を貸方に記入します。"
      },
      {
        "story": "わたあめの観覧車に乗っていた子どもたちにマシュマロ 150,000円分を売り上げ、代金はツケ（掛け）とした。「いくらでも食べていいよ！」（売掛金）（売上）",
        "debit": [{ "account": "売掛金", "amount": 150000 }],
        "credit": [{ "account": "売上", "amount": 150000 }],
        "explanation": "資産（Asset）である債権「売掛金」を借方に計上し、収益（Revenue）である「売上」を貸方に記入します。"
      },
      {
        "story": "ツケにしていた売掛金 150,000円が、遊園地のゴールド普通預金口座に振り込まれた。毎日が日曜日、ずっと遊んでいられる！（普通預金）（売掛金）",
        "debit": [{ "account": "普通預金", "amount": 150000 }],
        "credit": [{ "account": "売掛金", "amount": 150000 }],
        "explanation": "資産（Asset）である「普通預金」の増加を借方に記入し、資産「売掛金」の消滅を貸方に記入します。"
      }
    ]
  },
  {
    title: "2日目：伸びる耳とロバへの変異",
    questions: [
      {
        "story": "ゲームコーナーで遊び疲れたので、豪華なマッサージチェア（備品）200,000円を購入。設置費用 20,000円とともに代金は普通預金から支払った。（備品）（普通預金）",
        "debit": [{ "account": "備品", "amount": 220000 }],
        "credit": [{ "account": "普通預金", "amount": 220000 }],
        "explanation": "付随費用を取得原価に含めるため、資産（Asset）の「備品」220,000円を借方に計上します。"
      },
      {
        "story": "お菓子の国の中を暴走して遊ぶためのゴーカート（車両運搬具）800,000円を購入し、改造費 30,000円とともに当座預金口座から小切手を振り出して支払った。（車両運搬具）（当座預金）",
        "debit": [{ "account": "車両運搬具", "amount": 830000 }],
        "credit": [{ "account": "当座預金", "amount": 830000 }],
        "explanation": "付随費用を含めた「車両運搬具」830,000円を借方に計上し、小切手振出による「当座預金」の減少を貸方に記入します。"
      }
    ]
  },
  {
    title: "3日目：過酷なサーカスと太鼓の皮",
    questions: [
      {
        "story": "ビスケットの壁をかじりながら、新しいおもちゃ 300,000円を仕入れた。以前払っていた手付金 50,000円を充当し、残額は掛けとした。…なんだか頭がズキズキする。（仕入）（前払金）（買掛金）",
        "debit": [{ "account": "仕入", "amount": 300000 }],
        "credit": [{ "account": "前払金", "amount": 50000 }, { "account": "買掛金", "amount": 250000 }],
        "explanation": "費用（Expense）の「仕入」300,000円を借方に記入し、資産「前払金」50,000円と負債（Liability）「買掛金」250,000円を貸方に記入します。"
      },
      {
        "story": "甘いシロップジュース 400,000円を売り上げ、代金のうち 150,000円は現金で受け取り、残額は掛けとした。鏡を見ると、耳の先が少し尖って伸びているような…？（現金）（売掛金）（売上）",
        "debit": [{ "account": "現金", "amount": 150000 }, { "account": "売掛金", "amount": 250000 }],
        "credit": [{ "account": "売上", "amount": 400000 }],
        "explanation": "収益（Revenue）の「売上」400,000円を貸方に計上し、資産（Asset）の「現金」150,000円と「売掛金」250,000円を借方に記入します。"
      }
    ]
  },
  {
    title: "4日目：暗い海とフカの胃袋からの脱出",
    questions: [
      {
        "story": "「ヒ、ヒヒ…？」うまく声が出ない。遊園地の支配人から 500,000円を借り入れ、当座預金に入金された。手足に灰色の毛が生えてきたけれど、気のせいだよね？（当座預金）（借入金）",
        "debit": [{ "account": "当座預金", "amount": 500000 }],
        "credit": [{ "account": "借入金", "amount": 500000 }],
        "explanation": "資産（Asset）の「当座預金」増加を借方に記入し、負債（Liability）の「借入金」を貸方に計上します。"
      },
      {
        "story": "ツケにしていた売掛金 200,000円の回収として、友達が差し出した約束手形を受け取った。その友達の手には、もう指がなく、硬い蹄（ひづめ）になっていた。（受取手形）（売掛金）",
        "debit": [{ "account": "受取手形", "amount": 200000 }],
        "credit": [{ "account": "売掛金", "amount": 200000 }],
        "explanation": "手形債権である資産（Asset）の「受取手形」を借方に計上し、資産「売掛金」の消滅を貸方に記入します。"
      }
    ]
  },
  {
    title: "5日目：真面目な労働と本物の人間へ",
    questions: [
      {
        "story": "カツーン、カツーン。歩くたびに蹄の乾いた音が響く。お菓子の城（建物）に対する減価償却費 60,000円を直接法で計上した。もう言葉は喋れず、鳴き声しか出ない。（減価償却費）（建物）",
        "debit": [{ "account": "減価償却費", "amount": 60000 }],
        "credit": [{ "account": "建物", "amount": 60000 }],
        "explanation": "費用（Expense）である「減価償却費」を借方に計上し、資産「建物」を直接減額します。"
      },
      {
        "story": "連れて行かれた鉱山で荷物を背負わされながら、売掛金に対する貸倒引当金 10,000円を計上した。毎日遊んでいられる夢の国なんて、最初から無かったんだ。（貸倒引当金繰入）（貸倒引当金）",
        "debit": [{ "account": "貸倒引当金繰入", "amount": 10000 }],
        "credit": [{ "account": "貸倒引当金", "amount": 10000 }],
        "explanation": "費用（Expense）の「貸倒引当金繰入」を借方に記入し、評価性引当金の「貸倒引当金」を貸方に計上します。"
      }
    ]
  }
];

// ==================================================
// アプリ共通ロジック
// ==================================================
let currentStageIndex = 0;
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
  const savedStage = localStorage.getItem("boki_template_current_stage");
  currentStageIndex = savedStage ? parseInt(savedStage, 10) : 0;
  if (currentStageIndex < 0 || currentStageIndex >= STAGES.length) currentStageIndex = 0;
  loadStage(currentStageIndex);
}

function switchStage(stageIdx) {
  if (stageIdx === currentStageIndex && !isReviewMode) return;
  loadStage(stageIdx);
}

function loadStage(stageIdx) {
  currentStageIndex = stageIdx;
  localStorage.setItem("boki_template_current_stage", currentStageIndex);

  for (let i = 0; i < STAGES.length; i++) {
    const btn = document.getElementById(`tab-${i}`);
    if (btn) {
      if (i === stageIdx) btn.classList.add("active");
      else btn.classList.remove("active");
    }
  }

  const stageObj = STAGES[stageIdx];
  document.getElementById("stage-badge-text").textContent = stageObj.title;
  document.getElementById("sub-title").textContent = `〜 ${stageObj.title} 〜`;

  const keyPrefix = `boki_template_st${stageIdx}_`;
  let stageData = stageObj.questions;
  try {
    const customData = localStorage.getItem(`${keyPrefix}data`);
    if (customData) {
      const parsed = JSON.parse(customData);
      if (Array.isArray(parsed) && parsed.length > 0) stageData = parsed;
    }
  } catch(e) {}

  currentQuestions = [...stageData];
  currentIndex = 0;
  correctCount = 0;
  wrongList = [];
  isReviewMode = false;
  answeredSet.clear();

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(0);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="科目" value="${account}">
    <input type="number" placeholder="金額" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row && row.parentElement && row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("最低1行は必要です。");
  }
}

function loadQuestion(index) {
  if (!currentQuestions || currentQuestions.length === 0) return;
  if (index < 0 || index >= currentQuestions.length) index = 0;
  currentIndex = index;

  const tag = document.getElementById("status-tag");
  if (isReviewMode) {
    tag.textContent = "おもいだす時間";
    tag.className = "status-badge review";
  } else {
    tag.textContent = "たのしくあそび中♪";
    tag.className = "status-badge";
  }

  const prefix = isReviewMode ? "ふくしゅう" : `Day ${currentStageIndex + 1}`;
  document.getElementById("q-number").textContent = `${prefix} // ${index + 1} / ${currentQuestions.length}`;
  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result-box";
  document.getElementById("submit-btn").style.display = "block";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "結果をみる" : "つぎのお菓子へ ▶";

  const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = `${index + 1} / ${currentQuestions.length} 問 (${percent}%)`;
  // 借方の先頭科目入力欄に自動でカーソルを合わせる
  const firstDebitInput = document.querySelector("#debit-rows input[type='text']");
  if (firstDebitInput) firstDebitInput.focus();
}

function getEntries(side) {
  const container = document.getElementById(`${side}-rows`);
  if (!container) return [];
  const rows = container.children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    if (inputs.length >= 2) {
      const account = inputs[0].value.trim();
      const amount = parseInt(inputs[1].value, 10);
      if (account && !isNaN(amount)) entries.push({ account, amount });
    }
  }
  return entries;
}

function spawnRisingMagic() {
  const totalItems = 25;
  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement("div");
    item.className = "rising-item";
    item.textContent = RISING_EFFECT_SYMBOLS[Math.floor(Math.random() * RISING_EFFECT_SYMBOLS.length)];
    item.style.left = (Math.random() * 92 + 4) + "vw";
    
    const driftX = (Math.random() * 80 - 40) + "px";
    item.style.setProperty("--drift", driftX);

    const size = Math.random() * 16 + 20;
    const duration = Math.random() * 1.5 + 2.0;
    const delay = Math.random() * 0.4;

    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";
    item.style.animationDelay = delay + "s";

    document.body.appendChild(item);
    setTimeout(() => { item.remove(); }, (duration + delay) * 1000);
  }
}

function triggerShake() {
  const container = document.getElementById("mainContainer");
  container.classList.remove("shake-animation");
  void container.offsetWidth;
  container.classList.add("shake-animation");
  setTimeout(() => { container.classList.remove("shake-animation"); }, 500);
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const normalize = d => Array.isArray(d) ? d : [d];
  const cDebit = normalize(q.debit);
  const cCredit = normalize(q.credit);

  const matchSide = (u, c) => {
    if (u.length !== c.length) return false;
    const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
  };

  const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {
    spawnRisingMagic();
    res.className = "result-box correct";
    res.innerHTML = `<strong>おいしく正解！</strong><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      correctCount++;
      if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
      answeredSet.add(currentIndex);
    }
  } else {
    triggerShake();
    res.className = "result-box wrong";
    const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}円)`).join(" ");
    const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}円)`).join(" ");
    res.innerHTML = `<strong>あれ…？ちがうみたい（ヒヒーン…！）</strong><br>せいかい 借方: ${dStr}<br>せいかい 貸方: ${cStr}<br><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
      answeredSet.add(currentIndex);
    }
  }
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
  else showClearScreen();
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const revArea = document.getElementById("review-btn-area");

  badgeArea.innerHTML = "";
  revArea.innerHTML = "";

  if (wrongList.length === 0) {
    spawnRisingMagic();
    badgeArea.innerHTML = `<div style="display:inline-block; padding:8px 16px; background:#fef08a; border:2px solid #facc15; border-radius:12px; font-weight:bold; color:#854d0e; margin-bottom:12px;">たいへんよくできました！</div>`;
    scoreText.innerHTML = `ぜんぶせいかい！お菓子をいっぱい食べて満足したね…？ (${total}/${total})`;
  } else {
    scoreText.innerHTML = `${total} 問中 ${correctCount} 問 せいかい！<br>まちがえた問題が ${wrongList.length} 問 あります。耳がむずむずする…？`;
    const btn = document.createElement("button");
    btn.className = "btn-review";
    btn.textContent = `まちがえた問題をやりなおす (${wrongList.length}問)`;
    btn.onclick = () => {
      isReviewMode = true;
      currentQuestions = [...wrongList];
      currentIndex = 0;
      correctCount = 0;
      answeredSet.clear();
      document.getElementById("quiz-area").style.display = "block";
      clearArea.style.display = "none";
      loadQuestion(0);
    };
    revArea.appendChild(btn);
  }
}

function startFreshStage() {
  loadStage(currentStageIndex);
}

function forceReset() {
  if (confirm("入力したカスタムデータを初期化し、おかしの国を最初の状態にもどしますか？")) {
    localStorage.clear();
    location.reload();
  }
}

function loadCustomData() {
  const input = document.getElementById("json-input").value.trim();
  if (!input) {
    alert("レシピ（JSONデータ）を入力してください。");
    return;
  }
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    STAGES[currentStageIndex].questions = data;
    localStorage.setItem(`boki_template_st${currentStageIndex}_data`, JSON.stringify(data));
    loadStage(currentStageIndex);
    alert(`${STAGES[currentStageIndex].title}（全${data.length}問）のレシピを更新しました！`);
  } catch (e) {
    alert("⚠️ JSONの形式を確認してください。正しく貼り付けられているかチェックをお願いします。");
  }
}
// ==================================================
// キーボードショートカット設定
// ==================================================
window.addEventListener("keydown", (e) => {
  // レシピ入力エリア（textarea）編集中は何もしない
  if (e.target.tagName === "TEXTAREA") return;

  if (e.key === "ArrowRight") {
    const quizArea = document.getElementById("quiz-area");
    // 出題画面が表示されている時のみ動作
    if (quizArea && quizArea.style.display !== "none") {
      const res = document.getElementById("result-display");
      
      // 入力枠にカーソルがある場合：文字移動を邪魔しないよう、判定結果表示後のみ右矢印で次へ
      // 入力枠の外（ボタンなど）にある場合：そのまま右矢印で次へ
      const isTyping = e.target.tagName === "INPUT";
      if (!isTyping || (res && res.style.display === "block")) {
        e.preventDefault();
        nextQuestion();
      }
    }
  }
});

  
window.addEventListener("DOMContentLoaded", init);
</script>
